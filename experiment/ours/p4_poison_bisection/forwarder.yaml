# P4：各階段插件 @PARSE@／@FILTER@／@FORMAT@／@TRANSPORT@、二分隔離 @BISECTION@（run.sh 代入）
plugins:
  parse: @PARSE@
  filter: @FILTER@
  format: @FORMAT@
  transport: @TRANSPORT@
stages: {filter: true, format: true, transport: true}
input:
  mode: tcp
  tcp: {host: "0.0.0.0", port: @TCP_PORT@}
batch:
  mem_limit_mb: 256
  max_wait_ms: @FLUSH_MS@
  # 每批最多 128 KiB（約 128 筆 1 KiB 日誌）；等待上限放寬到 50 ms，讓 5,000 筆／秒時批次大致填滿
  micro_batch_max_bytes_kib: 128
  micro_batch_max_wait_ms: 50
  channel_capacity: 50000
  max_format_chunk: 10000
  max_transport_bytes: 134217728
  transport_workers: 1
  stage_timeout_ms: 2000
  # false 只供消融實驗：失敗的整批直接寫入 dead-letter，不找出是哪一筆
  bisection: @BISECTION@
endpoint:
  A: "http://127.0.0.1:@SINK_PORT@/ingest"
status_interval_secs: 0
# fault 插件 import 檔案與 socket 介面；inert 只連結介面、不給任何資源（一般插件不受影響）
capabilities:
  parse: {filesystem: inert, sockets: inert}
  filter: {filesystem: inert, sockets: inert}
  format: {filesystem: inert, sockets: inert}
  transport: {filesystem: inert, sockets: endpoint}
