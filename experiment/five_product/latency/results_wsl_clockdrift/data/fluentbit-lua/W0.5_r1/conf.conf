# Fluent Bit + Lua filter。@...@ 由 common/lib/run_point.sh 代入；filter.lua 掛在 /work。

[SERVICE]
    Flush         0.5
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          15140
    Format        json
    Tag           latency

[FILTER]
    Name            lua
    Match           latency
    Script          /work/filter.lua
    Call            latency_filter
    protected_mode  false

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           18080
    URI            /ingest
    Format         json_lines
    Json_date_key  false
    Workers        1
    Retry_Limit    False
