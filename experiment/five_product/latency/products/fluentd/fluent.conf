# Fluentd + Ruby filter（plugins/）。flush_interval 小於 1 時 Fluentd 實際以 flush_thread_interval 為時間窗。

<source>
  @type tcp
  bind 0.0.0.0
  port @TCP_PORT@
  tag latency

  <parse>
    @type json
  </parse>
</source>

<filter latency>
  @type latency_test
</filter>

<match latency>
  @type http
  endpoint http://127.0.0.1:@SINK_PORT@/ingest
  open_timeout 30
  read_timeout 30

  <format>
    @type json
  </format>
  json_array false

  <buffer>
    @type memory
    flush_mode interval
    flush_interval @FLUSH@
    chunk_limit_size 128m
    total_limit_size 256m
    flush_thread_count 1
    flush_thread_interval @FLUSH_THREAD@
    flush_thread_burst_interval 0.01
    flush_at_shutdown true
    retry_max_times 0
    overflow_action block
  </buffer>
</match>
