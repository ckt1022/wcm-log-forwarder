# Fluent Bit + WASM filter（Rust，wasm32-wasip1）。filter.wasm 由 common/setup.sh 從 filter/ 編譯。

[SERVICE]
    Flush         @FLUSH@
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          @TCP_PORT@
    Format        json
    Tag           latency

[FILTER]
    Name             wasm
    Match            latency
    WASM_Path        /work/filter.wasm
    Function_Name    filter_func
    Wasm_Heap_Size   268435456
    Wasm_Stack_Size  8388608

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           @SINK_PORT@
    URI            /ingest
    Format         json_lines
    Json_date_key  false
    Workers        1
    Retry_Limit    False
