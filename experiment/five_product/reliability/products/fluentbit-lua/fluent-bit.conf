# Fluent Bit + Lua filter。@...@ 由 common/lib/run_point.sh 代入；filter.lua 掛在 /work。

[SERVICE]
    Flush         @FLUSH@
    Grace         5
    # 可靠性實驗：重試退避 1 s 起、上限 30 s（預設 base 5 s、cap 2000 s）
    scheduler.base 1
    scheduler.cap  30
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          @TCP_PORT@
    Format        json
    Tag           latency

[FILTER]
    Name            lua
    Match           latency
    Script          /work/filter.lua
    Call            latency_filter
    protected_mode  false

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           @SINK_PORT@
    URI            /ingest
    Format         json_lines
    Json_date_key  false
    Workers        1
    Retry_Limit    False
