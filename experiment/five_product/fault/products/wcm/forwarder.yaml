# WCM（core/ 與 plugins/ 的 Rust 插件，插件已內建在映像的 /app/plugin）
plugins:
  # 故障測試插件（plugins/rust/fault），msg 含標記時在處理這一筆時故障
  parse: fault/parse.wasm
  filter: filter.wasm
  format: format.wasm
  transport: transport.wasm
stages: {filter: true, format: true, transport: true}
input:
  mode: tcp
  tcp: {host: "0.0.0.0", port: @TCP_PORT@}
batch:
  mem_limit_mb: 256
  max_wait_ms: @FLUSH_MS@
  channel_capacity: 50000
  max_format_chunk: 10000
  max_transport_bytes: 134217728
  transport_workers: 1
  # 呼叫時限 T（與先前的故障實驗相同）
  stage_timeout_ms: 2000
endpoint:
  A: "http://127.0.0.1:@SINK_PORT@/ingest"
status_interval_secs: 0
# fault 插件會 import 檔案與 socket 介面；inert 只連結介面，不給任何資源
capabilities:
  parse: {filesystem: inert, sockets: inert}
